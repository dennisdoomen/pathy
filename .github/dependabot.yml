version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "16:00"
      timezone: "Europe/Copenhagen"
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "16:00"
      timezone: "Europe/Copenhagen"
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Verify.Xunit (xUnit v2) stops at 31.12.5. Newer Verify.DiffPlex versions need a newer
      # Verify core, which breaks Verify.Xunit at runtime with a MethodAccessException.
      - dependency-name: "Verify.DiffPlex"
